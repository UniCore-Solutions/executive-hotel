# Hotel Collection platform — full stack (PostgreSQL, Kafka, backend, guest frontend, back-office).
#
#   Base file      : production-shaped images (multi-stage, non-root, healthchecks)
#   dev overlay    : docker-compose.dev.yml   — bind-mounted sources + dev servers
#   prod overlay   : docker-compose.prod.yml  — hardened ports/profile/logging
#
# Start with ./scripts/start.sh  (adds --dev / --prod overlays automatically).
# All variables come from .env (copy of .env.example created by ./scripts/setup.sh).

name: hotel-platform

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: hotel-platform-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run ./scripts/setup.sh}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hotel_platform}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - hotel-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: hotel-platform-kafka
    environment:
      # Single-node KRaft. Dual listeners so containers use kafka:29092 while
      # apps running on the host can still use localhost:9092.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - hotel-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend-hotel
      target: runtime
    image: hotel-platform/backend:local
    container_name: hotel-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-hotel_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing - run ./scripts/setup.sh}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET missing - run ./scripts/setup.sh}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      KAFKA_BOOTSTRAP: kafka:29092
      MEDIA_STORAGE_PATH: /app/media
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:8180}
      DOCUMENTS_STORAGE_PATH: /app/documents
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      OUTBOX_RELAY_INTERVAL_MS: ${OUTBOX_RELAY_INTERVAL_MS:-1000}
      RESERVATION_HOLD_MINUTES: ${RESERVATION_HOLD_MINUTES:-15}
      RESERVATION_HOLD_EXPIRY_INTERVAL_MS: ${RESERVATION_HOLD_EXPIRY_INTERVAL_MS:-60000}
      PAYMENT_SIMULATED_DELAY_MIN_MS: ${PAYMENT_SIMULATED_DELAY_MIN_MS:-1500}
      PAYMENT_SIMULATED_DELAY_MAX_MS: ${PAYMENT_SIMULATED_DELAY_MAX_MS:-4000}
      # Dev convenience only — the backend defaults this to false and rejects
      # it under the prod profile (docker-compose.prod.yml sets that profile).
      PAYMENT_AUTO_SETTLE_ENABLED: ${PAYMENT_AUTO_SETTLE_ENABLED:-true}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-simulated}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@hotel-platform.local}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: ${JVM_OPTS:-}
    ports:
      - "${BACKEND_PORT:-8180}:8180"
    volumes:
      - media_data:/app/media
      - documents_data:/app/documents
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8180/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - hotel-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-hotel
      target: runner
      args:
        NEXT_PUBLIC_USE_MOCK_SERVICES: ${NEXT_PUBLIC_USE_MOCK_SERVICES:-false}
        NEXT_PUBLIC_PLATFORM_SLUG: ${NEXT_PUBLIC_PLATFORM_SLUG:-executive-hotel}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_FX_EUR: ${NEXT_PUBLIC_FX_EUR:-0.091}
        NEXT_PUBLIC_FX_USD: ${NEXT_PUBLIC_FX_USD:-0.100}
        NEXT_PUBLIC_FX_GBP: ${NEXT_PUBLIC_FX_GBP:-0.078}
        NEXT_PUBLIC_ENABLE_CHATBOT: ${NEXT_PUBLIC_ENABLE_CHATBOT:-false}
        NEXT_PUBLIC_ENABLE_ANALYTICS: ${NEXT_PUBLIC_ENABLE_ANALYTICS:-false}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8180}
    image: hotel-platform/frontend:local
    container_name: hotel-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Server-side fetches (RSC/BFF) go straight to the backend over the internal network.
      API_INTERNAL_URL: http://backend:8180/graphql
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - hotel-network
    restart: unless-stopped

  backoffice:
    profiles: ["backoffice"]
    build:
      context: ./backoffice-hotel
      target: runner
    image: hotel-platform/backoffice:local
    container_name: hotel-backoffice
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3101"
      HOSTNAME: 0.0.0.0
      # BFF proxy target (server-side only; the browser never sees this host).
      HOTEL_API_URL: http://backend:8180/graphql
    ports:
      - "${BACKOFFICE_PORT:-3101}:3101"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3101/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - hotel-network
    restart: unless-stopped

  admin:
    build:
      context: ./admin-hotel
      target: runner
    image: hotel-platform/admin:local
    container_name: hotel-admin
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3102"
      HOSTNAME: 0.0.0.0
      # BFF proxy target (server-side only; the browser never sees this host).
      HOTEL_API_URL: http://backend:8180/graphql
    ports:
      - "${ADMIN_PORT:-3102}:3102"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3102/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - hotel-network
    restart: unless-stopped

networks:
  hotel-network:

volumes:
  postgres_data:
  kafka_data:
  media_data:
  documents_data:
