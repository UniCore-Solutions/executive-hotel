mutation CreateRoom($hotelId: ID!, $input: AdminRoomInput!) {
  createRoom(hotelId: $hotelId, input: $input) {
    id
    roomNumber
    floor
    status
    housekeepingStatus
    maintenanceStatus
  }
}

mutation UpdateRoom($id: ID!, $input: AdminRoomInput!) {
  updateRoom(id: $id, input: $input) {
    id
    roomNumber
    floor
    status
    housekeepingStatus
    maintenanceStatus
  }
}