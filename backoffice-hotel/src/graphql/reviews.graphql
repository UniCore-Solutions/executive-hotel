query AdminReviews($hotelId: ID!, $status: ReviewModerationStatus, $page: PageInput) {
  adminReviews(hotelId: $hotelId, status: $status, page: $page) {
    total
    page
    size
    items {
      id
      hotelId
      authorName
      rating
      title
      comment
      moderationStatus
      responseText
      createdAt
    }
  }
}

mutation ModerateReview($id: ID!, $status: ReviewModerationStatus!, $response: String) {
  moderateReview(id: $id, status: $status, response: $response) {
    id
    moderationStatus
    responseText
  }
}