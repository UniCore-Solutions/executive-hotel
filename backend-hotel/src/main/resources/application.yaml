spring:
  application:
    name: hotel-platform
  profiles:
    # Local development defaults to the 'dev' profile (GraphiQL, dev-friendly
    # settings). Deployments MUST activate 'prod' explicitly.
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hotel_platform}
    username: ${POSTGRES_USER:postgres}
    # REQUIRED — no default. A fallback of "postgres" silently ships a
    # guessable credential anywhere the variable is missed; failing to start
    # is the safer outcome. Set it in .env (scripts/setup.sh generates one).
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    # XML, not the default (lenient, NekoHTML-based) HTML mode: openhtmltopdf
    # parses rendered templates with a strict XML parser, so both the
    # template source and Thymeleaf's own parsing of it must be well-formed
    # (self-closed void elements, no unclosed tags) — Thymeleaf 3 has no
    # separate "XHTML" mode, XML is the strict one. Only used for
    # server-rendered PDF documents (templates/invoices/**) — nothing else in
    # this app uses Thymeleaf.
    mode: XML
  graphql:
    graphiql:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hotel-platform
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hotelcollection.hotel.*"
  # SMTP transport for app.email.provider=smtp (email/SmtpEmailProvider). Gmail's
  # SMTP relay is the reference target (smtp.gmail.com:587 + an app password),
  # but nothing here is Gmail-specific — any SMTP host works. Harmless to leave
  # configured even when app.email.provider=simulated (the default): a
  # JavaMailSender bean gets created, but nothing connects until something
  # actually calls send().
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  security:
    # REQUIRED — no default. The app fails to start without a strong JWT_SECRET
    # (see JwtService for the length/known-value guard). Generate one with:
    #   openssl rand -hex 32
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    # Comma-separated peer addresses whose X-Forwarded-For the rate limiter will
    # believe. EMPTY BY DEFAULT — an attacker-settable header must never key a
    # rate-limit budget (rotating it defeated the limiter entirely before this
    # existed). Set this to the ingress/BFF address in a deployment where that
    # hop sets a trustworthy X-Forwarded-For; leave empty and every caller
    # behind the proxy shares one budget, which throttles rather than lets
    # traffic through.
    trusted-proxies: ${TRUSTED_PROXIES:}
  cors:
    # Comma-separated allowed origins for browsers (default * = any origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    base-url: ${MEDIA_BASE_URL:http://localhost:8180}
  documents:
    storage-path: ${DOCUMENTS_STORAGE_PATH:./data/documents}
  email:
    # simulated (default): logs the rendered email, never delivers — safe with
    # no credentials configured anywhere. smtp: delivers through spring.mail.*
    # above (email/SmtpEmailProvider). Adding another provider (SendGrid, SES,
    # Mailgun, …) is a new EmailProvider implementation + a new enum value in
    # EmailProvider.ProviderType + this switching to its name — no business
    # service, Kafka consumer or template changes.
    provider: ${EMAIL_PROVIDER:simulated}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@hotel-platform.local}
  # Base URL of the guest site, used only to build links inside emails
  # (manage-booking, retry-payment, account) — the backend never serves these
  # pages itself.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  otp:
    # How long a code stays enterable (registration verification and guest
    # reservation lookup both use this).
    code-ttl-minutes: ${OTP_CODE_TTL_MINUTES:10}
    # Minimum gap between two codes issued for the same (email, purpose) —
    # defense in depth against email-bombing beyond RateLimitFilter's
    # per-IP budget.
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # Once verified, how long the reservation-lookup grant (OtpService#isGrantValid)
    # stays usable — longer than code-ttl-minutes on purpose: entering the
    # code is the hard part, browsing afterward shouldn't need re-verifying.
    lookup-grant-minutes: ${OTP_LOOKUP_GRANT_MINUTES:30}
  oauth:
    google:
      # Blank (the default) disables Google sign-in entirely:
      # GoogleIdentityProvider's bean never registers (@ConditionalOnProperty),
      # so IdentityProviderRegistry has no GOOGLE entry and
      # GET /api/v1/auth/google 404s cleanly — no other code branches on this.
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8180/api/auth/google/callback}
    # How long an authorization attempt's CSRF state/nonce stays valid.
    state-ttl-minutes: ${OAUTH_STATE_TTL_MINUTES:10}
    # How long the post-callback login grant (the backend->frontend BFF
    # handoff) stays redeemable — short: the frontend redeems it immediately.
    grant-ttl-minutes: ${OAUTH_GRANT_TTL_MINUTES:2}
    cleanup-interval-ms: ${OAUTH_CLEANUP_INTERVAL_MS:300000}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: 50
  reservations:
    # Payment hold TTL: a reservation created 'pending' is auto-cancelled and
    # its inventory released if payment never captures within this window.
    hold-minutes: ${RESERVATION_HOLD_MINUTES:15}
    hold-expiry-interval-ms: ${RESERVATION_HOLD_EXPIRY_INTERVAL_MS:60000}
  payments:
    # Simulated async provider settlement delay (createPayment schedules one
    # callback in this window; no real gateway exists).
    simulated-settlement-delay-min-ms: ${PAYMENT_SIMULATED_DELAY_MIN_MS:1500}
    simulated-settlement-delay-max-ms: ${PAYMENT_SIMULATED_DELAY_MAX_MS:4000}
    # When false, a plain card checkout (no explicit simulateOutcome — i.e.
    # every real guest booking) never auto-resolves; the payment sits
    # 'pending' until manually settled via the webhook or the admin trigger.
    # Postman/QA requests that pass simulateOutcome explicitly are unaffected
    # either way.
    #
    # Defaults to FALSE and is REJECTED AT STARTUP under the prod profile
    # (PaymentSafetyConfig): with no real gateway, enabling this confirms
    # reservations and sells inventory with no money movement. Dev/QA opt in
    # explicitly via PAYMENT_AUTO_SETTLE_ENABLED (docker-compose.yml sets it).
    auto-settle-enabled: ${PAYMENT_AUTO_SETTLE_ENABLED:false}
    # Shared secret for the /api/v1/payments/{id}/webhook simulated-provider
    # callback (no user session — see SecurityConfig). Blank (the default)
    # rejects every call, so the endpoint fails closed until explicitly
    # configured for manual/QA use.
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

logging:
  pattern:
    # TraceIdFilter puts the request's correlation id in the MDC; surfacing it
    # in every line is what makes a security warning traceable to the request
    # (and to the traceId the client saw in its ApiError response).
    level: "%5p [${spring.application.name:hotel-platform},traceId=%X{traceId:-}]"

server:
  port: ${BACKEND_PORT:8180}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: prod
  graphql:
    graphiql:
      enabled: false
    schema:
      introspection:
        enabled: false

app:
  security:
    headers:
      # Content-Security-Policy (API responses carry no inline assets; GraphiQL
      # stays enabled in dev, so the header is only emitted in prod).
      content-security-policy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'"