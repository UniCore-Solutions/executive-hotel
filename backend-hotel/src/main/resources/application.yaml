spring:
  application:
    name: hotel-platform
  profiles:
    # Local development defaults to the 'dev' profile (GraphiQL, dev-friendly
    # settings). Deployments MUST activate 'prod' explicitly.
    default: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hotel_platform}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  graphql:
    graphiql:
      enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hotel-platform
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hotelcollection.hotel.*"

app:
  security:
    # REQUIRED — no default. The app fails to start without a strong JWT_SECRET
    # (see JwtService for the length/known-value guard). Generate one with:
    #   openssl rand -hex 32
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors:
    # Comma-separated allowed origins for browsers (default * = any origin).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./data/media}
    base-url: ${MEDIA_BASE_URL:http://localhost:8180}
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:1000}
    batch-size: 50

server:
  port: ${BACKEND_PORT:8180}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

---
spring:
  config:
    activate:
      on-profile: prod
  graphql:
    graphiql:
      enabled: false
    schema:
      introspection:
        enabled: false

app:
  security:
    headers:
      # Content-Security-Policy (API responses carry no inline assets; GraphiQL
      # stays enabled in dev, so the header is only emitted in prod).
      content-security-policy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'"