<!DOCTYPE html>
<!--
  Rendered server-side by NotificationServiceImpl. XML/XHTML mode (see
  templates/email/fragments/layout.html's header comment for the full
  constraint explanation). Receives exactly two variables: theme
  (EmailTheme) and data (WelcomeEmailData) — see NotificationServiceImpl's
  class javadoc for why.
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .email-content { padding-left: 26px !important; padding-right: 26px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f7f4ee;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f4ee;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" class="email-container" cellpadding="0" cellspacing="0"
               style="width:600px;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td th:replace="~{email/fragments/layout :: header(${theme})}"></td>
          </tr>
          <tr>
            <td class="email-content" align="center" style="padding:48px 48px 40px 48px;">
              <p style="margin:0 0 10px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#b98b3e;">
                Account created
              </p>
              <h1 style="margin:0 0 18px 0;font-family:Georgia,'Times New Roman',Times,serif;
                         font-size:28px;line-height:1.25;color:#20242c;font-weight:400;">
                Welcome
              </h1>
              <p style="margin:0 0 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:16px;line-height:1.6;color:#20242c;">
                Hello <strong th:text="${data.firstName}">Guest</strong>,
              </p>
              <p style="margin:0 0 30px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:16px;line-height:1.6;color:#5b6472;max-width:440px;">
                Your account is ready. You can now sign in at any time to view your reservations,
                update your details and manage upcoming stays.
              </p>
              <table th:replace="~{email/fragments/layout :: button(${theme}, ${data.accountUrl}, 'Sign in to your account')}"></table>
            </td>
          </tr>
          <tr>
            <td th:replace="~{email/fragments/layout :: footer(${theme})}"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
