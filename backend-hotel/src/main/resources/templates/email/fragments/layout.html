<!DOCTYPE html>
<!--
  Shared email fragments — every template in templates/email/*.html pulls
  its header/footer/button from here via th:replace, so the whole email
  system shares one visual identity (§23) with one place to change it.

  Rendered server-side by NotificationServiceImpl (XML/XHTML mode — Thymeleaf
  is configured in XML mode app-wide, see application.yaml — same constraint
  as templates/invoices/*.html: every tag must be well-formed and properly
  closed). Every dynamic value uses th:text (auto-escaping); never th:utext,
  since guest/hotel data is not developer-controlled.

  th:fragment element types match what they replace: header/footer are <td>
  fragments (dropped into a placeholder <td> in each template's outer
  table), button is a <table> fragment (dropped inline into content).
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<body>

  <!-- Hotel identity header: logo (if one exists) + hotel name on the
       theme's primary color. Falls back to a text-only mark when there is
       no logo — never a broken-image box is the only thing shown. -->
  <td th:fragment="header(theme)" align="center"
      th:style="'padding:36px 48px 30px 48px;background-color:' + ${theme.primaryColor} + ';'">
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
      <tr>
        <td align="center">
          <img th:if="${theme.logoUrl != null}" th:src="${theme.logoUrl}" th:alt="${theme.logoAlt}"
               width="120" style="display:block;margin:0 auto 12px auto;max-width:120px;height:auto;border:0;outline:none;" />
        </td>
      </tr>
      <tr>
        <td align="center">
          <p th:style="'margin:0;font-family:' + ${theme.headingFontFamily} + ';font-size:19px;line-height:1.3;letter-spacing:0.05em;text-transform:uppercase;color:#ffffff;'"
             th:text="${theme.hotelName}">Hotel Name</p>
        </td>
      </tr>
    </table>
  </td>

  <!-- Footer: hotel contact details + a subtle disclosure line. Only shows
       fields that actually exist — never invents an address/phone/site. -->
  <td th:fragment="footer(theme)" align="center"
      th:style="'padding:28px 48px 34px 48px;background-color:' + ${theme.backgroundColor} + ';border-top:1px solid ' + ${theme.borderColor} + ';'">
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;max-width:460px;">
      <tr>
        <td align="center"
            th:style="'padding-bottom:6px;font-family:' + ${theme.bodyFontFamily} + ';font-size:13px;font-weight:600;color:' + ${theme.textColor} + ';'"
            th:text="${theme.hotelName}">Hotel Name</td>
      </tr>
      <tr th:if="${theme.footerAddress != null}">
        <td align="center"
            th:style="'padding-bottom:4px;font-family:' + ${theme.bodyFontFamily} + ';font-size:12px;color:' + ${theme.mutedTextColor} + ';'"
            th:text="${theme.footerAddress}">Address</td>
      </tr>
      <tr th:if="${theme.footerPhone != null or theme.footerEmail != null}">
        <td align="center"
            th:style="'padding-bottom:4px;font-family:' + ${theme.bodyFontFamily} + ';font-size:12px;color:' + ${theme.mutedTextColor} + ';'">
          <span th:if="${theme.footerPhone != null}" th:text="${theme.footerPhone}">Phone</span>
          <span th:if="${theme.footerPhone != null and theme.footerEmail != null}"> &#183; </span>
          <span th:if="${theme.footerEmail != null}" th:text="${theme.footerEmail}">Email</span>
        </td>
      </tr>
      <tr>
        <td align="center"
            th:style="'padding-top:14px;font-family:' + ${theme.bodyFontFamily} + ';font-size:11px;line-height:1.5;color:#9aa2ab;'">
          You are receiving this email because of a reservation or account activity at
          <span th:text="${theme.hotelName}">Hotel Name</span>.
        </td>
      </tr>
    </table>
  </td>

  <!-- Bulletproof-ish CTA button: table+td background instead of an <a>
       background so it degrades gracefully (a plain but still legible link)
       in clients that ignore the td background (older Outlook). -->
  <table th:fragment="button(theme, url, label)" role="presentation" cellpadding="0" cellspacing="0"
         align="center" style="margin:28px auto 4px auto;">
    <tr>
      <td align="center" th:style="'border-radius:6px;background-color:' + ${theme.primaryColor} + ';'">
        <a th:href="${url}" th:text="${label}"
           th:style="'display:inline-block;padding:14px 34px;font-family:' + ${theme.bodyFontFamily} + ';font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;'">
          Continue
        </a>
      </td>
    </tr>
  </table>

</body>
</html>
