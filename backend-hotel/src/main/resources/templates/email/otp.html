<!DOCTYPE html>
<!--
  DESIGN-ONLY — not wired to any sender. No OTP/email-verification flow
  exists anywhere in this codebase to trigger this template; see
  com.hotelcollection.hotel.dto.email.OtpEmailData's javadoc. Kept here,
  themed and ready, for when one exists.

  Rendered server-side by NotificationServiceImpl. XML/XHTML mode (see
  templates/email/fragments/layout.html). Variables: theme (EmailTheme),
  data (OtpEmailData).
-->
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verification code</title>
  <style>
    @media only screen and (max-width: 620px) {
      .email-container { width: 100% !important; }
      .email-content { padding-left: 26px !important; padding-right: 26px !important; }
      .otp-code { font-size: 34px !important; letter-spacing: 8px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f7f4ee;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f4ee;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" class="email-container" cellpadding="0" cellspacing="0"
               style="width:600px;max-width:600px;background-color:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td th:replace="~{email/fragments/layout :: header(${theme})}"></td>
          </tr>
          <tr>
            <td class="email-content" align="center" style="padding:48px 48px 40px 48px;">
              <h1 style="margin:0 0 10px 0;font-family:Georgia,'Times New Roman',Times,serif;
                         font-size:26px;line-height:1.25;color:#20242c;font-weight:400;">
                Verify your request
              </h1>
              <p style="margin:0 0 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:15px;line-height:1.6;color:#5b6472;" th:if="${data.firstName != null}">
                Hello <span th:text="${data.firstName}">Guest</span>, your verification code is:
              </p>
              <p style="margin:0 0 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:15px;line-height:1.6;color:#5b6472;" th:unless="${data.firstName != null}">
                Your verification code is:
              </p>

              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px auto 22px auto;">
                <tr>
                  <td align="center"
                      style="padding:20px 36px;border:1px solid #e6e2da;border-radius:10px;background-color:#f7f4ee;">
                    <span class="otp-code" th:text="${data.code}"
                          style="font-family:Georgia,'Times New Roman',Times,serif;font-size:40px;font-weight:700;
                                 letter-spacing:12px;color:#142639;">123456</span>
                  </td>
                </tr>
              </table>

              <p style="margin:0 0 4px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:14px;line-height:1.6;color:#5b6472;">
                This code expires in <strong th:text="${data.expiresInDisplay}">10 minutes</strong>.
              </p>
              <p style="margin:18px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
                        font-size:13px;line-height:1.6;color:#9aa2ab;">
                If you did not request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td th:replace="~{email/fragments/layout :: footer(${theme})}"></td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
