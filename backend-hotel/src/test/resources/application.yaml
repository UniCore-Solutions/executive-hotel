# Test-only config: shared by every integration test context (Testcontainers).
# NOTE: this file shadows src/main/resources/application.yaml entirely, so the
# full base configuration must be reproduced here. The outbox relay polls far
# apart so it never interleaves with the N+1 query-count assertion; Hibernate
# statistics are enabled for that assertion.
app:
  security:
    jwt-secret: ${JWT_SECRET:test-only-strong-secret-3f9a2c7e1b8d4f6a9c0e2d5b8a1f3c7e}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    # The suite performs far more registrations/bookings per minute from one
    # test IP than the anonymous budgets allow, so the per-IP rate limit is off
    # by default; RateLimitIntegrationTest enables it explicitly.
    rate-limit-enabled: false
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./target/test-data/media}
    base-url: http://localhost:8180
  documents:
    storage-path: ${DOCUMENTS_STORAGE_PATH:./target/test-data/documents}
  email:
    provider: ${EMAIL_PROVIDER:simulated}
    from-address: no-reply@hotel-platform.test
  otp:
    code-ttl-minutes: 10
    # Disabled by default: most tests re-issue a code directly (via
    # OtpService#issue, which returns the plaintext) to capture a known value
    # for a code the flow under test already sent once — the same "issue
    # twice" pattern a real cooldown would legitimately block. The one test
    # that asserts the cooldown itself (OtpResendCooldownIntegrationTest)
    # re-enables it via @TestPropertySource, same idiom RateLimitIntegrationTest
    # uses for app.security.rate-limit-enabled.
    resend-cooldown-seconds: 0
    max-attempts: 5
    lookup-grant-minutes: 30
  oauth:
    # Google left unconfigured by default (no client-id) — GoogleIdentityProvider's
    # bean never registers, matching the "feature off" state most tests run
    # against. OAuthLoginIntegrationTest supplies its own fake provider bean
    # instead of setting real credentials here.
    state-ttl-minutes: 10
    grant-ttl-minutes: 2
    cleanup-interval-ms: 600000
  frontend-base-url: http://localhost:3000
  outbox:
    relay-interval-ms: 600000
    batch-size: 50
  reservations:
    hold-minutes: 15
    # Slow, like the outbox relay above: tests that exercise hold expiry
    # manipulate holdExpiresAt and call BookingService#expireHold directly
    # rather than waiting on the real scheduled job.
    hold-expiry-interval-ms: 600000
  payments:
    # Fast enough for a test to poll for the async outcome without a real
    # multi-second sleep; only ever scheduled for provider "card" (see
    # PaymentServiceImpl#scheduleSimulatedSettlement) — no existing test
    # uses that provider, so this has no effect on them.
    simulated-settlement-delay-min-ms: 50
    simulated-settlement-delay-max-ms: 150
    # Opt in explicitly: the main config defaults this to false (prod refuses
    # to start with it on — see PaymentSafetyConfig). The suite exercises the
    # simulator directly, e.g.
    # PaymentSimulationIntegrationTest#cardPaymentAutoSettlesAndPromotesReservationToConfirmed.
    auto-settle-enabled: true
    webhook-secret: test-only-webhook-secret
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  thymeleaf:
    mode: XML
  # Present so spring-boot-starter-mail's MailSenderAutoConfiguration creates
  # a JavaMailSender bean (SmtpEmailProvider needs one to exist, even though
  # the default test provider is "simulated" and never calls send()). No
  # credentials — nothing in the suite actually connects.
  mail:
    host: smtp.gmail.com
    port: 587
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  graphql:
    graphiql:
      enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hotel-platform
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hotelcollection.hotel.*"