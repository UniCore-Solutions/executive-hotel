# Test-only config: shared by every integration test context (Testcontainers).
# NOTE: this file shadows src/main/resources/application.yaml entirely, so the
# full base configuration must be reproduced here. The outbox relay polls far
# apart so it never interleaves with the N+1 query-count assertion; Hibernate
# statistics are enabled for that assertion.
app:
  security:
    jwt-secret: ${JWT_SECRET:test-only-strong-secret-3f9a2c7e1b8d4f6a9c0e2d5b8a1f3c7e}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    # The suite performs far more registrations/bookings per minute from one
    # test IP than the anonymous budgets allow, so the per-IP rate limit is off
    # by default; RateLimitIntegrationTest enables it explicitly.
    rate-limit-enabled: false
  media:
    storage-path: ${MEDIA_STORAGE_PATH:./target/test-data/media}
    base-url: http://localhost:8180
  documents:
    storage-path: ${DOCUMENTS_STORAGE_PATH:./target/test-data/documents}
  outbox:
    relay-interval-ms: 600000
    batch-size: 50
  reservations:
    hold-minutes: 15
    # Slow, like the outbox relay above: tests that exercise hold expiry
    # manipulate holdExpiresAt and call BookingService#expireHold directly
    # rather than waiting on the real scheduled job.
    hold-expiry-interval-ms: 600000
  payments:
    # Fast enough for a test to poll for the async outcome without a real
    # multi-second sleep; only ever scheduled for provider "card" (see
    # PaymentServiceImpl#scheduleSimulatedSettlement) — no existing test
    # uses that provider, so this has no effect on them.
    simulated-settlement-delay-min-ms: 50
    simulated-settlement-delay-max-ms: 150
    # Opt in explicitly: the main config defaults this to false (prod refuses
    # to start with it on — see PaymentSafetyConfig). The suite exercises the
    # simulator directly, e.g.
    # PaymentSimulationIntegrationTest#cardPaymentAutoSettlesAndPromotesReservationToConfirmed.
    auto-settle-enabled: true
    webhook-secret: test-only-webhook-secret
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
  thymeleaf:
    mode: XML
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  graphql:
    graphiql:
      enabled: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: hotel-platform
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.hotelcollection.hotel.*"