services:
  postgres:
    image: postgres:16.4-alpine
    container_name: hotel-platform-postgres
    environment:
      POSTGRES_DB: hotel_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka-native:3.9.1
    container_name: hotel-platform-kafka
    ports:
      - "9092:9092"

volumes:
  postgres-data:
