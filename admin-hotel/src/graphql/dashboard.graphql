query AdminDashboard($hotelId: ID!) {
  adminDashboard(hotelId: $hotelId) {
    hotelId
    hotelName
    arrivalsToday
    departuresToday
    inHouseToday
    soldOutTonight
    occupancyPct
    availableTonight
    revenueTotal
    pendingPayments
    pendingInvoices
    recentReservations {
      id
      reference
      status
      paymentStatus
      checkInDate
      checkOutDate
      totalAmount
      currencyCode
      createdAt
      guest {
        firstName
        lastName
      }
    }
    arrivalsTodayList {
      id
      reference
      status
      checkInDate
      checkOutDate
      guest {
        firstName
        lastName
      }
      roomLines {
        id
        roomTypeId
        roomTypeName
        nights
        roomId
        roomNumber
      }
    }
    departuresTodayList {
      id
      reference
      status
      checkInDate
      checkOutDate
      guest {
        firstName
        lastName
      }
      roomLines {
        id
        roomTypeId
        roomTypeName
        nights
        roomId
        roomNumber
      }
    }
  }
}
