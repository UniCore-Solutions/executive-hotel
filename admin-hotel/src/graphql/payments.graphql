query AdminPayments($hotelId: ID!, $search: String, $sort: String, $page: PageInput) {
  adminPayments(hotelId: $hotelId, search: $search, sort: $sort, page: $page) {
    total
    page
    size
    items {
      id
      reservationId
      amount
      currencyCode
      status
      provider
      providerReference
      createdAt
    }
  }
}
