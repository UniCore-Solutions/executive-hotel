query AdminHotelSettings($hotelId: ID!) {
  adminHotel(hotelId: $hotelId) {
    id
    name
    status
    hotel {
      id
      name
      brand
      description
      hotelType
      addressLine1
      addressLine2
      city
      countryCode
      latitude
      longitude
      phone
      email
      website
      timezone
      languages
      starRating
      checkInTime
      checkOutTime
      defaultCurrency
      status
    }
    amenities {
      id
      name
      icon
      category
    }
    media {
      id
      url
      altText
      category
      isPrimary
      sortOrder
    }
    policies {
      id
      hotelId
      name
      value
      icon
      sortOrder
    }
  }
}
