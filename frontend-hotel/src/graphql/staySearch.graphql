query StaySearch($input: StaySearchInput!) {
  staySearch(input: $input) {
    hotelId
    hotelName
    status
    capacityFits
    roomType {
      ...RoomTypeSummary
    }
    rates {
      roomTypeId
      ratePlanId
      ratePlanCode
      ratePlanName
      mealPlan
      pricePerNight
      currencyCode
      cancellationPolicy
      isRefundable
      paymentTiming
      depositPercentage
    }
  }
}
