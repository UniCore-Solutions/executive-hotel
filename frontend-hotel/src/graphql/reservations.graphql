mutation CancelReservation($input: CancelReservationInput!) {
  cancelReservation(input: $input) {
    reservation {
      id
      reference
      status
      cancellation {
        id
        reason
        reasonNote
        isRefundable
        penaltyAmount
        refundAmount
        cancelledAt
      }
    }
    created
  }
}
