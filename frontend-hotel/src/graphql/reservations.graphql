query MyReservations {
  myReservations {
    ...ReservationSummary
  }
}

query ReservationLookup($input: ReservationLookupInput!) {
  reservation(input: $input) {
    ...ReservationSummary
  }
}

# OTP-gated counterpart of ReservationLookup — used only by the "check my
# reservation" self-service flow (ReservationFlow.tsx), never by the
# same-session payment-status poller, which keeps using ReservationLookup.
query VerifiedReservationLookup($input: VerifiedReservationLookupInput!) {
  verifiedReservation(input: $input) {
    ...ReservationSummary
  }
}
