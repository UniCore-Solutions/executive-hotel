mutation CreateReservation($input: CreateReservationInput!) {
  createReservation(input: $input) {
    reservation {
      id
      reference
      hotelId
      status
      paymentStatus
      checkInDate
      checkOutDate
      adults
      children
      currencyCode
      subtotalAmount
      discountAmount
      taxAmount
      feeAmount
      totalAmount
      source
      notes
      createdAt
      guest {
        id
        firstName
        lastName
        email
        phone
        countryCode
      }
      roomLines {
        id
        roomTypeId
        ratePlanId
        checkInDate
        checkOutDate
        nights
        ratePerNight
        subtotalAmount
        status
      }
      extras {
        id
        extraId
        name
        quantity
        unitPrice
        totalPrice
      }
      charges {
        id
        name
        chargeType
        amount
      }
    }
    created
  }
}

