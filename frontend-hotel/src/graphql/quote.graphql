query Quote($input: QuoteInput!) {
  quote(input: $input) {
    currencyCode
    subtotalAmount
    discountAmount
    taxAmount
    feeAmount
    totalAmount
    paymentTiming
    amountDueNow
    originalTotal
    valid
    message
    lines {
      roomTypeId
      ratePlanId
      ratePerNight
      nights
      subtotalAmount
    }
    extras {
      extraId
      quantity
      unitPrice
      totalPrice
    }
    charges {
      taxFeeTypeId
      chargeType
      name
      amount
    }
  }
}
