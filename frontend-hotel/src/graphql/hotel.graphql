query HotelById($id: ID!) {
  hotel(id: $id) {
    ...HotelSummary
  }
}

query HotelDetails($id: ID!) {
  hotelDetails(id: $id) {
    hotel {
      ...HotelSummary
    }
    experiences {
      id
      name
      description
      category
      durationMinutes
      priceAmount
      currencyCode
      location
      sortOrder
    }
    restaurants {
      id
      name
      description
      cuisineType
      openingHours
      location
      sortOrder
    }
    faqs {
      id
      question
      answer
      category
      sortOrder
    }
    policies {
      id
      name
      value
      icon
      sortOrder
    }
    reviews {
      total
      page
      size
      items {
        id
        authorName
        rating
        title
        comment
        responseText
        createdAt
      }
    }
    reviewsCount
    averageRating
  }
}

query HotelRoomTypes($hotelId: ID!) {
  roomTypes(hotelId: $hotelId) {
    ...RoomTypeSummary
  }
}

query HotelOffers($hotelId: ID!) {
  offers(hotelId: $hotelId) {
    id
    code
    name
    description
    discountType
    discountValue
    bookingWindowStart
    bookingWindowEnd
    stayWindowStart
    stayWindowEnd
    minNights
    stackable
    appliesToAllRoomTypes
    appliesToAllRatePlans
    status
  }
}

query StayAvailability($input: AvailabilityInput!) {
  availability(input: $input) {
    roomTypeId
    available
    status
    capacityFits
  }
}

query StayRates($input: RatesInput!) {
  rates(input: $input) {
    roomTypeId
    ratePlanId
    ratePlanCode
    ratePlanName
    mealPlan
    pricePerNight
    currencyCode
    cancellationPolicy
    isRefundable
  }
}
