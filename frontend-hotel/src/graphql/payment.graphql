mutation CreatePayment($input: CreatePaymentInput!) {
  createPayment(input: $input) {
    id
    reservationId
    amount
    currencyCode
    status
    provider
    providerReference
    createdAt
  }
}

mutation CapturePayment($input: CapturePaymentInput!) {
  capturePayment(input: $input) {
    id
    reservationId
    amount
    currencyCode
    status
    provider
    providerReference
    createdAt
  }
}
